apis:
- name: Faculty180 Faculty Activity Reporting API
  description: 'RESTful API for the Faculty180 (Faculty Activity Reporting) system, exposing
    faculty listings, courses taught, scholarly contribution and professional (SCP) activity
    attachments, faculty vita, and public faculty activity search. Authenticated with an HMAC
    signature (INTF public:signature Authorization header, Timestamp, and INTF-DatabaseID
    header) against a per-institution database ID.'
  humanURL: https://www.faculty180.com/api_docs
  baseURL: https://faculty180.interfolio.com
  properties:
  - type: Documentation
    url: https://www.faculty180.com/api_docs
  - type: APIReference
    url: https://faculty180.interfolio.com/swagger/ui/
- name: Interfolio Core, Search & RPT API
  description: 'REST and GraphQL APIs for the Interfolio Faculty Information System covering
    core Units, Faculty Search (Positions, Position Types/Status, Applications, Application
    Documents, Reports), and Review, Promotion & Tenure (Units, Committees, Forms, Packets,
    Workflow Steps, Evaluator Sections, Reports, Users). Backend/middleware integration API
    authenticated with an HMAC public/private key pair scoped by numeric tenantId.'
  humanURL: https://interfolio.com/data/
  baseURL: https://logic.interfolio.com
