aid: interfolio
name: Interfolio
description: 'Interfolio is a Faculty Information System (now an Elsevier product) that helps
  colleges and universities manage the full faculty lifecycle: recruiting and hiring (Faculty
  Search), activity reporting and reviews (Faculty180 / Faculty Activity Reporting), review,
  promotion and tenure (RPT), lifecycle management, faculty web profiles, and the Dossier
  application service for individual academics. Interfolio exposes REST and GraphQL APIs for
  integrating faculty, activity, position, and review data with campus systems, secured with
  an HMAC public/private key mechanism scoped by tenant. Surfaced as a portfolio company of
  Insight Partners and enriched with real developer-surface artifacts.'
